# MNIST 教学数据集配置示例

# 完整数据集配置
defaults:
  - dataset: tutorial_mnist

dataset:
  data_dir: "./data/mnist"
  download: true
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true

# 快速实验配置（使用子集）
# dataset:
#   data_dir: "./data/mnist"
#   download: true
#   subset_size: 1000  # 只使用1000个样本
#   batch_size: 32
#   num_workers: 2

# 数据增强配置示例
# dataset:
#   data_dir: "./data/mnist"
#   download: true
#   batch_size: 32
#   random_rotation: 15.0  # 随机旋转 ±15度
#   random_crop: [24, 24]  # 随机裁剪到24x24
