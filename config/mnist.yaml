name: training_project
description: ''
version: 1.0.0
output_dir: ./output/mnist_example
experiment_name: mnist_experiment
model:
  _target_: src.model.tutorial_mnist.model.MnistModel
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 1.0e-05
    amsgrad: false
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    interval: step
    frequency: 10
    strict: true
    T_max: 100
    eta_min: 0.0
  metric_manager:
    _target_: src.metric._manager.manager.MetricManager
    metrics:
      training_state:
        metrics:
          loss:
            _target_: src.metric.value_recoder.metric.ValueRecorderMetric
            aggregation: mean
          learning_rate:
            _target_: src.metric.value_recoder.metric.ValueRecorderMetric
            aggregation: mean
        log_config:
          phase:
          - train
          update_frequency: 5
          compute_frequency: 5
          prog_bar: true
          logger: true
          on_step: true
          on_epoch: true
          sync_dist: true
          reduce_fx: mean
      classification:
        metrics:
          accuracy:
            _target_: torchmetrics.classification.Accuracy
            task: multiclass
            num_classes: 10
            average: macro
          f1_score:
            _target_: torchmetrics.classification.F1Score
            task: multiclass
            num_classes: 10
            average: macro
          precision:
            _target_: torchmetrics.classification.Precision
            task: multiclass
            num_classes: 10
            average: macro
          recall:
            _target_: torchmetrics.classification.Recall
            task: multiclass
            num_classes: 10
            average: macro
        log_config:
          phase:
          - train
          update_frequency: 1
          compute_frequency: 1
          prog_bar: true
          logger: true
          on_step: true
          on_epoch: true
          sync_dist: true
          reduce_fx: mean
  network:
    _target_: src.network.tutorial_lenet.network.LeNet
    input_channels: 1
    num_classes: 10
datamodule:
  _target_: src._datamodule.base.datamodule.BaseDataModule
  train:
    _target_: src.dataset.tutorial_mnist.dataset.MnistDataset
    batch_size: 128
    num_workers: 0
    shuffle: true
    pin_memory: true
    drop_last: false
    persistent_workers: false
    data_dir: ./data/mnist
    download: true
    dataset_range:
    - 0.0
    - 0.15
  val:
    _target_: src.dataset.tutorial_mnist.dataset.MnistDataset
    batch_size: 2
    num_workers: 0
    shuffle: false
    pin_memory: true
    drop_last: false
    persistent_workers: false
    data_dir: ./data/mnist
    download: true
    dataset_range:
    - 0.95
    - 1.0
  test:
    _target_: src.dataset.tutorial_mnist.dataset.MnistDataset
    batch_size: 32
    num_workers: 0
    shuffle: false
    pin_memory: true
    drop_last: false
    persistent_workers: false
    data_dir: ./data/mnist
    download: true
    dataset_range:
    - 0.0
    - 1.0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32-true
  logger: true
  log_every_n_steps: 5
  fast_dev_run: false
  max_epochs: 3
  max_steps: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  limit_predict_batches: 1.0
  overfit_batches: 0.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  accumulate_grad_batches: 1
  gradient_clip_algorithm: norm
  inference_mode: true
  use_distributed_sampler: true
  detect_anomaly: false
  barebones: false
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
callbacks:
  sample_saver:
    _target_: src._callback.sample_saver.callback.SampleSaverCallback
    save_dir: ./output/mnist_example/samples
    save_keys:
      image:
        source: batch
        keys:
        - image
        format: image
        extension: .png
        save_frequency: 10
        phases:
        - val
        - test
        custom_save_kwargs: {}
      label:
        source: batch
        keys:
        - label
        format: json
        extension: .json
        save_frequency: 10
        phases:
        - val
        - test
        custom_save_kwargs: {}
      preds:
        source: outputs
        keys:
        - preds
        format: json
        extension: .json
        save_frequency: 10
        phases:
        - val
        - test
        custom_save_kwargs: {}
    default_save_frequency: 100
    default_max_samples: 4
    default_phases:
    - val
    use_epoch_dirs: true
    use_step_dirs: false
    dir_structure: epoch
    auto_create_dirs: true
    add_timestamp: true
    add_step_info: true
loggers:
  csv:
    _target_: pytorch_lightning.loggers.CSVLogger
    version: 0
    prefix: ''
    save_dir: ./output/mnist_example/logs
    name: lightning_logs
    flush_logs_every_n_steps: 50
  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    version: 0
    prefix: ''
    save_dir: ./output/mnist_example/logs
    name: lightning_logs
    default_hp_metric: true
    log_graph: false
    filename_suffix: ''
mode: train
tags: []
notes: ''
deterministic: false
